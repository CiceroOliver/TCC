syntax = "proto3";

package nascerr.v1;

import "google/protobuf/timestamp.proto";

// ----------------------
// ENUMS
// ----------------------
enum CmdType {
  READ_CMD = 0;
  WRITE_CMD = 1;
}

enum ECCMode {
  ECC_UNKNOWN = 0;
  BYPASS_1 = 1;
  BYPASS_2 = 2;
  TBEC = 3;
  MRSC = 4;
  DUAL_BYPASS = 5;
}

enum WriteType {
  WRITE_ZEROS = 0;
  WRITE_ONES = 1;
  WRITE_x55h = 2;
  WRITE_xAAh = 3;
  WRITE_IMAGE = 4;
}

enum CommandAckStatus {
  CMD_ACK_SUCCESS = 0;
  CMD_ACK_FAIL    = 1;
}

// ----------------------
// FEEDBACK EXP REPORT
// ----------------------

message CommandAckReport {
  string device_name  = 1;
  uint32 command_id   = 2;
  CommandAckStatus status = 3;
  string error        = 4;
}

// ----------------------
// FEEDBACK IMAGE PRESENT
// ----------------------

message ImageReport 
{
  bool image_load = 1;
  uint32 image_size = 2;
  string image_name = 3;
}

// ----------------------
// FIRMWARE UPDATE
// ----------------------
message FirmwareUpdate {
  string version = 1;
  bytes file_data = 2;
  int32 file_size = 3;
}

// ----------------------
// TELEMETRIA ELEMENTOS
// ----------------------
message FirmwareVersion {
  string firmware_version = 1;
  google.protobuf.Timestamp ts = 2;
}

message EXPStatus {
  uint32 qtd_scheduler_total = 1;
  uint32 qtd_scheduler_pending = 2;
  uint32 qtd_scheduler_executed = 3;
  uint32 qtd_experiments_total = 4;
  uint32 qtd_experiments_running = 5;
  uint32 qtd_experiments_finished = 6;
}

message MDCAData {
  uint32 gnss_week = 1;
  uint32 gnss_tow = 2;
  float latitude = 3;
  float longitude = 4;
  float altitude_ellipsoid = 5;
  float altitude_msl = 6;
  float ecef_x = 7;
  float ecef_y = 8;
  float ecef_z = 9;
}

message ECCTelemetry {
  uint32 single_bit_errors = 1;
  uint32 double_bit_errors = 2;
  uint32 triple_bit_errors = 3;
  uint32 beg_region_errors = 4;
  uint32 mid_region_errors = 5;
  uint32 end_region_errors = 6;
  uint32 uncorrectable_errors = 7;
  ECCMode ecc = 8;
  uint32 ecc_status = 9;
}

message LogEntry {
  uint64 timestamp = 1;
  string type = 2;
  string status = 3;
  string error_code = 4;
}

message HardwareInfo {
  float temperature_c = 1;
  map<string, float> currents = 2;
  map<string, float> power = 3;
  float total_power = 4;
  google.protobuf.Timestamp ts = 5;
}

// ----------------------
// TELEMETRY PACKET (pacotão unificado)
// ----------------------
message TelemetryPacket {
  string device_name = 1;
  HardwareInfo hw_info = 2;
  EXPStatus exp_status = 3;
  MDCAData mdca = 4;
  repeated LogEntry logs = 5;
  FirmwareVersion firmware = 6;
  ImageReport image_report = 7;
  google.protobuf.Timestamp ts = 8;
}

// ----------------------
// EXPERIMENTOS
// ----------------------
message ExperimentCommand {
  uint32 id = 1;
  CmdType cmd_type = 2;
  uint32 block = 3;
  uint32 qtd_block = 4;
  ECCMode ecc = 5;
  WriteType write_type = 6;
  uint32 scheduler_time = 7;
  uint32 repeat = 8;
  uint32 delay = 9;
  google.protobuf.Timestamp created_at = 10;
}

message ExperimentResult {
  uint32 experiment_id = 1;
  uint32 block = 2;
  uint32 data_length = 3;
  uint32 time_delta = 4;
  uint32 number_errors = 5;
  uint32 corrected_data = 6;
  float percent_error = 7;
  ECCTelemetry ecc_telemetry = 8;
  MDCAData mdca_data = 9;
  google.protobuf.Timestamp created_at = 10;
}

message ExperimentResultBatch {
  string device_name = 1;
  repeated ExperimentResult results = 2;
  google.protobuf.Timestamp received_at = 3;
}

// ----------------------
// SIMPLE REQUESTS
// ----------------------
message DeviceRequest {
  string device_name = 1;
}

// ----------------------
// FIRMWARE POLL RESPONSE
// ----------------------
message PollFirmwareResponse {
  bool has_update = 1;
  FirmwareUpdate update = 2;
}

// ----------------------
// ACK
// ----------------------
message Ack {
  bool ok = 1;
  string message = 2;
}

// ======================
// SERVIÇO
// ======================
service ExperimentAgentService {

  // ----------------------
  // Fluxo 1: Telemetria completa (pacotão)
  // ----------------------
  rpc SendTelemetry(stream TelemetryPacket) returns (Ack);

  // ----------------------
  // Fluxo 2: Resultados de Experimentos
  // ----------------------
  rpc SendResultBatch(ExperimentResultBatch) returns (Ack);

  // ----------------------
  // Fluxo 3: Fila de comandos de experimento
  // ----------------------
  rpc PollCommands(DeviceRequest) returns (stream ExperimentCommand);

  // ----------------------
  // Fluxo 4: Fila de firmware update
  // ----------------------
  rpc PollFirmware(DeviceRequest) returns (stream PollFirmwareResponse);

  // ----------------------
  // Fluxo 5: Reporte do processamento do comandos de escrita
  // ----------------------
  rpc ReportCommandAck(CommandAckReport) returns (Ack);
  
}
