[pytest]
markers =
    hardware: leitura de corrente e temperatura, ciclo de sleep e wakeup
    log: preenchimento da flash interna e migração para a externa
    bootloader: atualização completa de firmware
    experimento: agendamento de escritas e leitura com ECC
    operacao: taxas crescentes, saturação da fila e soak
    soak: ensaio de carga contínua de 30 min
